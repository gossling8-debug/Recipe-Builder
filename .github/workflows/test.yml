name: Tests

# Every pull request (see docs/ENGINEERING.md). Three separate checks, so one can't hide
# another: the app's tests, the database security rules, and known vulnerabilities in
# the libraries the app and server ship with. Click-through tests run the real app
# against the Firebase emulators with stand-ins for Claude and Stripe — nothing reaches
# either, and no secrets are needed.
on:
  pull_request:
  workflow_dispatch:

# Read-only: tests never need to change the repository.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 — the database emulator runs on Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Type check (app, and the tests outside src/)
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.tests.json
      - name: Unit tests (app)
        run: npm test
      - name: Unit tests (server)
        run: npx vitest run
        working-directory: functions
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Click-through tests
        run: bash e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: click-through-results
          path: |
            playwright-report
            test-results
            e2e/.out/logs
          retention-days: 7

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # the rules testing library needs Node 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Database security rules
        run: bash rules/run.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # If an advisory has no fix yet, the pull request explains why it's acceptable for now.
      - name: Known vulnerabilities (app)
        run: npm audit --omit=dev --audit-level=high
      - name: Known vulnerabilities (server)
        run: npm audit --omit=dev --audit-level=high
        working-directory: functions
