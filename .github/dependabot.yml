# Weekly checks for updated libraries and build actions (security fixes are proposed
# as soon as GitHub learns of them). Each update is a pull request that runs every test.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Everything runs on Node 22 (the server: functions/package.json engines; the build and
      # tests: node-version in .github/workflows). Newer type definitions would allow features
      # Node 22 lacks. Remove this when moving to a newer Node (docs/DECISIONS.md).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/functions"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      # Steps that only work as a set are updated together.
      pages:
        patterns: ["actions/configure-pages", "actions/upload-pages-artifact", "actions/deploy-pages"]
      codeql:
        patterns: ["github/codeql-action*"]
